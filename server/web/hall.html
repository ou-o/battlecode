<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BattleCode · 大厅</title>
<link rel="stylesheet" href="/battle.css" />
</head>
<body class="page-hall">
<div class="wrap">

  <div class="topbar">
    <span class="sig"><span class="dot"></span>SERVER ONLINE · battlecode.site</span>
    <span>HOST CONSOLE · 大厅</span>
  </div>

  <header class="hero">
    <div class="hero-tag">CONTROL CONSOLE</div>
    <div class="logo">大厅</div>
    <div class="sub">房间总览 · 新建对局</div>
  </header>

  <!-- 口令门户：默认隐藏；仅当服务端仍要求口令（还原场景）时由 console.js 显示。 -->
  <section class="card gate-card" id="pwGate" hidden>
    <span class="sec-no">SEC.AUTH</span>
    <h2>输入口令进入大厅</h2>
    <p class="muted">需要控制台口令以解锁房间总览与建房权限。口令由服务端校验，未通过接口与房间数据均不可访问。</p>
    <div class="row">
      <input id="pwInput" type="password" placeholder="控制台口令" autocomplete="current-password" />
      <button id="btnPwEnter" class="btn btn-primary" disabled>进入大厅</button>
    </div>
    <p class="err" id="pwErr"></p>
  </section>

  <!-- 通过口令后显示的内容 -->
  <section class="card" id="overviewPanel" hidden>
    <span class="sec-no">SEC.01</span>
    <h2>房间总览 <span class="sub" id="ovCount"></span></h2>
    <div class="table-wrap">
      <table class="rooms" id="roomsTable">
        <thead>
          <tr>
            <th>房间号</th><th>阶段</th><th>玩家</th><th>在线</th><th>房主</th>
            <th>连接</th><th>最近活动</th><th>开始时间</th><th>胜方</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="ovEmpty">无房间</p>
  </section>

  <section class="card new-room" id="createPanel" hidden>
    <span class="sec-no">SEC.02</span>
    <h2>新建房间</h2>
    <div class="row">
      <label>房主名
        <input id="hostName" placeholder="房主昵称" />
      </label>
      <label>房间号（三位数字，可空随机）
        <input id="codeHint" class="code" placeholder="如 365" maxlength="3" pattern="\d{3}" />
      </label>
      <button id="btnCreate" class="btn btn-primary">创建房间</button>
    </div>
    <p class="muted" id="setupErr"></p>
  </section>

  <footer>
    <div class="bar"></div>
    BATTLECODE · HOST CONSOLE
  </footer>

</div>
<script src="/console.js"></script>
</body>
</html>
