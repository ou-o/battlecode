<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BattleCode · 房间</title>
<link rel="stylesheet" href="/battle.css" />
</head>
<body class="page-room">
<div class="wrap" style="max-width:1280px">

  <div class="topbar">
    <span class="sig"><span class="dot"></span>SERVER ONLINE · battlecode.site</span>
    <span>HOST CONSOLE · <a href="/hall.html">回大厅</a></span>
  </div>

  <!-- 房间状态条 -->
  <section class="card" id="roomBar">
    <span class="sec-no" id="phaseNo">SEC.ROOM</span>
    <h2>房间 <span class="sub" id="phase">—</span></h2>
    <div class="row">
      <label>房间号<b><span class="mono" id="code">—</span></b></label>
      <label>房主<b id="hostName">—</b></label>
      <span class="spacer" style="flex:1"></span>
      <button id="btnStart" class="btn btn-primary" disabled>开始游戏</button>
      <button id="btnClose" class="btn btn-danger" disabled>关闭房间</button>
    </div>

    <!-- 重进验证码 + 复制按钮 -->
    <p class="muted-sm token-caption">重进验证码</p>
    <div class="tokenbar">
      <input id="tokenField" readonly />
      <button id="btnCopyRaw" class="btn btn-ghost btn-sm" disabled>复制验证码</button>
    </div>
  </section>

  <main hidden>
    <section class="card">
      <span class="sec-no">SEC.01</span>
      <h2>玩家（ID 0–22）</h2>
      <h3 class="sub-title red">红方 · RED</h3>
      <table class="players">
        <thead><tr><th>昵称</th><th>在线</th><th>角色</th><th>绑定 ID</th><th>血量</th></tr></thead>
        <tbody id="playersRed"></tbody>
      </table>
      <h3 class="sub-title blue">蓝方 · BLUE</h3>
      <table class="players">
        <thead><tr><th>昵称</th><th>在线</th><th>角色</th><th>绑定 ID</th><th>血量</th></tr></thead>
        <tbody id="playersBlue"></tbody>
      </table>
      <div id="playersNone"></div>
    </section>

    <section class="card">
      <span class="sec-no">SEC.02</span>
      <h2>掩体（ID 23–32）</h2>
      <div class="row">
        <input id="bunkerIds" class="mono" placeholder="如 23,24,25,30" />
        <button id="btnBindBunkers" class="btn btn-ghost">录入</button>
      </div>
      <div id="bunkers" class="tags" style="min-height:26px"></div>
    </section>

    <section class="card">
      <span class="sec-no">SEC.03</span>
      <h2>基地</h2>
      <div class="bar-row"><span class="lbl red">红 33</span><div class="bar"><div id="redHp" class="fill red" style="width:0%"></div><span id="redHpText">—</span></div></div>
      <div class="bar-row"><span class="lbl blue">蓝 34</span><div class="bar"><div id="blueHp" class="fill blue" style="width:0%"></div><span id="blueHpText">—</span></div></div>
    </section>
  </main>

  <aside class="panel" hidden>
    <span class="sec-no">SEC.LOG</span>
    <h2>事件流</h2>
    <ol id="log"></ol>
  </aside>

  <p id="errText"></p>
</div>
<script src="/room.js"></script>
</body>
</html>
